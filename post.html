<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#f6f8fa">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!--OG-->
<meta property="og:type" content="article">
<meta property="og:site_name" content="Pusat Solusi IT">
<meta property="og:title" content="Pusat Solusi IT">
<meta property="og:description" content="Link solusi, software, dan panduan End User Support.">
<meta property="og:image" content="%SITE_URL%/og-image.png">
<meta name="twitter:card" content="summary_large_image">

<script>try{if(localStorage.getItem("kb:theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/">
      <img class="brand-logo" src="/assets/logo.svg" alt="" width="40" height="40">
      <span style="min-width:0">
        <span class="brand-name" data-site-name>Pusat Solusi IT</span>
        <span class="brand-sub" data-site-tagline></span>
      </span>
    </a>
    <nav class="top-actions" aria-label="Menu">
      <a class="top-link hide-sm" href="/">Cari lagi</a>
      <a class="btn-atlas" href="https://atlas-rsudrtn.vercel.app" target="_blank" rel="noopener"><svg class="oct" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.75 2h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v8.5c0 .14.11.25.25.25h8.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5C2 2.78 2.78 2 3.75 2Zm6.85-.13 3.53.01c.2 0 .37.16.37.37v3.53a.25.25 0 0 1-.43.17L12.81 4.7 8.78 8.72a.75.75 0 0 1-1.06-1.06l4.03-4.03-1.25-1.25a.25.25 0 0 1 .1-.51Z"/></svg><span>LINK ATLAS</span></a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Ganti ke tema gelap" title="Ganti tema"><svg class="oct icon-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.598 1.591a.749.749 0 0 1 .785-.175 7.001 7.001 0 1 1-8.967 8.967.75.75 0 0 1 .961-.96 5.5 5.5 0 0 0 7.046-7.046.75.75 0 0 1 .175-.786Zm1.616 1.945a7 7 0 0 1-7.678 7.678 5.499 5.499 0 1 0 7.678-7.678Z"/></svg><svg class="oct icon-sun" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm5.66-6.1a.75.75 0 0 1-1.06-1.06l.71-.71a.75.75 0 1 1 1.06 1.06ZM3.4 13.66l-.7.7a.75.75 0 0 1-1.07-1.06l.71-.7A.75.75 0 0 1 3.4 13.66ZM8 0a.75.75 0 0 1 .75.75v1a.75.75 0 0 1-1.5 0v-1A.75.75 0 0 1 8 0Zm0 13.5a.75.75 0 0 1 .75.75v1a.75.75 0 0 1-1.5 0v-1A.75.75 0 0 1 8 13.5ZM16 8a.75.75 0 0 1-.75.75h-1a.75.75 0 0 1 0-1.5h1A.75.75 0 0 1 16 8ZM2.5 8a.75.75 0 0 1-.75.75h-1a.75.75 0 0 1 0-1.5h1A.75.75 0 0 1 2.5 8Zm11.16 5.66-.7-.7a.75.75 0 0 1 1.06-1.07l.7.71a.75.75 0 1 1-1.06 1.06ZM3.4 2.34a.75.75 0 0 1-1.06 1.06l-.71-.7A.75.75 0 0 1 2.7 1.63Z"/></svg></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <nav class="crumb"><a href="/" id="backLink">← Kembali ke pencarian</a></nav>
  <div id="view">
    <div class="doc">
      <div class="doc-main"><div class="skeleton" style="height:220px"></div></div>
      <aside class="links-panel"><div class="skeleton" style="height:120px"></div></aside>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="wrap">
    <div class="foot-row">
      <span><span data-site-name>Pusat Solusi IT</span></span>
      <a href="/admin">Masuk admin</a>
    </div>
    <p class="watermark">Dibuat oleh End User Support RSUD RTN Sidoarjo - Oktober - 2026</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script src="/assets/common.js"></script>
<script>
(function () {
  const { sb, configured, KINDS, esc, safeUrl, kbCode, date, views, renderContent, codeBlock, copy, brand, cfg } = window.KB;
  brand();
  const view = document.getElementById("view");
  const id = new URLSearchParams(location.search).get("id");

  if (document.referrer && new URL(document.referrer, location.href).origin === location.origin &&
      new URL(document.referrer).pathname === "/") {
    document.getElementById("backLink").href = document.referrer;
  }

  function message(title, body) {
    view.innerHTML = `<div class="empty" style="margin-top:16px"><strong>${title}</strong>${body}</div>`;
  }

  if (!configured || !sb) return message("Situs belum tersambung ke database.", "Isi config.js terlebih dahulu.");
  if (!id) return message("Postingan tidak ditemukan.", 'Kembali ke <a href="/">halaman pencarian</a>.');

  const OUT = '<svg class="oct" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.75 2h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v8.5c0 .14.11.25.25.25h8.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5C2 2.78 2.78 2 3.75 2Zm6.85-.13 3.53.01c.2 0 .37.16.37.37v3.53a.25.25 0 0 1-.43.17L12.81 4.7 8.78 8.72a.75.75 0 0 1-1.06-1.06l4.03-4.03-1.25-1.25a.25.25 0 0 1 .1-.51Z"/></svg>';

  (async () => {
    const { data: p, error } = await sb.from("posts").select("*").eq("id", id).maybeSingle();
    if (error) return message("Data tidak bisa dimuat.", "Periksa koneksi internet lalu muat ulang halaman.");
    if (!p) return message("Postingan tidak ditemukan.", 'Mungkin sudah dihapus. Kembali ke <a href="/">halaman pencarian</a>.');

    document.title = p.title + " · " + (cfg.SITE_NAME || "Pusat Solusi IT");
    const k = KINDS[p.kind] || KINDS.solusi;
    const links = (Array.isArray(p.links) ? p.links : [])
      .map((l) => ({ label: l.label || l.url, url: safeUrl(l.url) })).filter((l) => l.url);

    const snippets = (Array.isArray(p.snippets) ? p.snippets : []).filter((s) => s && s.code);
    const snippetsHtml = snippets.length
      ? `<h2 class="snippets-head">Perintah siap salin (${snippets.length})</h2>` +
        snippets.map((s) => codeBlock(s.code, s.label)).join("")
      : "";

    const linksHtml = links.length
      ? links.map((l, i) => `<div class="link-row">
          <a class="btn-open" href="${esc(l.url)}" target="_blank" rel="noopener"><span>${esc(l.label)}</span>${OUT}</a>
          <div class="link-url"><code title="${esc(l.url)}">${esc(l.url)}</code>
            <button class="btn-mini" type="button" data-copy="${i}">Salin link</button></div>
        </div>`).join("")
      : `<p style="margin:0;color:var(--muted)">Postingan ini tidak memiliki link.</p>`;

    view.innerHTML = `<article class="doc">
      <div class="doc-main">
        <div class="card-meta">
          <span class="kind kind-${esc(p.kind)}">${k.label}</span>
          <a class="tag" href="/?kategori=${encodeURIComponent(p.category)}">${esc(p.category)}</a>
          <span class="code">${kbCode(p.code)}</span>
        </div>
        <h1>${esc(p.title)}</h1>
        ${p.summary ? `<p class="lead">${esc(p.summary)}</p>` : ""}
        ${snippetsHtml}
        <div class="prose">${renderContent(p.content) || ""}</div>
        ${p.tags && p.tags.length ? `<div class="tags">${p.tags.map((t) =>
          `<a class="tag" href="/?q=${encodeURIComponent(t)}">#${esc(t)}</a>`).join("")}</div>` : ""}
        <p class="card-meta" style="margin-top:18px">
          <span class="views" id="viewCount">${views(p.views)} kali dilihat</span><span>·</span>
          <span>Diperbarui ${date(p.updated_at)}</span>
        </p>
      </div>
      <aside class="links-panel" aria-label="Link">
        <h2>Link (${links.length})</h2>
        ${linksHtml}
        <div class="share-row">
          <button class="btn-mini" type="button" id="copyPage">Salin judul &amp; link</button>
          <button class="btn-mini" type="button" id="copyCode">Salin ${kbCode(p.code)}</button>
        </div>
      </aside>
    </article>`;

    view.querySelectorAll("[data-copy]").forEach((b) =>
      b.addEventListener("click", () => copy(links[+b.dataset.copy].url, b)));
    const pageUrl = location.origin + "/post?id=" + encodeURIComponent(p.id);
    document.getElementById("copyPage").addEventListener("click", (e) => copy("*" + p.title + "*\n" + (p.summary ? p.summary + "\n" : "") + pageUrl, e.currentTarget));
    document.getElementById("copyCode").addEventListener("click", (e) => copy(kbCode(p.code) + " — " + p.title + "\n" + pageUrl, e.currentTarget));

    const n = await window.KB_countView(p.id);
    if (n != null) document.getElementById("viewCount").textContent = views(n) + " kali dilihat";
  })();
})();
</script>
</body>
</html>
